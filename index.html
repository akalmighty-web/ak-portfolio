<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />

    <!-- Google Search Console verification: paste the
         <meta name="google-site-verification" content="..." /> tag on the next line -->

    <!-- seo:head (title, description, canonical, link previews and structured data:
         filled in per page from src/seo.js by scripts/prerender.js) -->
    <!-- /seo:head -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      .sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
    </style>
  </head>
  <body>
    <!-- the page's text as plain HTML (visually hidden) for search engines; the app replaces it -->
    <div id="root"><!-- seo:body --><!-- /seo:body --></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
